<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Спасибо за заявку — Чижевская</title>
  <meta name="description" content="Заявка принята. Следующий шаг — согласовать объём и план проекта.">
  <style>
    :root{--ink:#17231e;--paper:#f5f1e9;--moss:#3f5b4b;--rust:#b85d3b;--line:#d8d1c4}
    *{box-sizing:border-box}html{background:var(--paper)}body{margin:0;min-height:100vh;background:var(--paper);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,sans-serif;display:grid;place-items:center;padding:24px}.card{max-width:680px;width:100%;border:1px solid var(--line);background:#fffdf8;padding:clamp(32px,7vw,72px);text-align:center}.mark{color:var(--rust);font-weight:800;letter-spacing:.12em;text-transform:uppercase;font-size:12px}h1{font-family:Georgia,serif;font-weight:400;font-size:clamp(42px,7vw,76px);line-height:1.02;margin:22px 0 20px}p{color:#637168;line-height:1.6;font-size:17px;margin:0 auto 28px;max-width:520px}.next{border-top:1px solid var(--line);padding-top:22px;margin-top:22px;color:#405047;font-size:14px;line-height:1.6}.calculator{display:grid;gap:10px;text-align:left;border:1px solid var(--line);padding:18px;margin-top:24px}.calculator label,.payment label{display:grid;gap:5px;text-align:left;color:var(--ink);font-size:14px;font-weight:700}.calculator input,.payment input{padding:10px;border:1px solid var(--line);font:inherit}.calculator output{color:var(--moss);font-size:13px;line-height:1.4}.payment{display:grid;gap:12px;margin-top:18px}.button{display:inline-block;margin-top:8px;background:var(--moss);color:#fff;padding:15px 24px;text-decoration:none;font-weight:750;border:0;cursor:pointer}.button:hover{background:var(--rust)}#paymentStatus{color:var(--rust);font-size:14px;margin:0}.back{display:inline-block;margin-top:22px;color:var(--rust);font-weight:700}
  </style>
</head>
<body>
  <main class="card">
    <div class="mark">Чижевская · заявка принята</div>
    <h1>Спасибо.</h1>
    <p>Заявка получена. Ниже можно прикинуть объём проекта и оплатить предоплату 50 000 ₽.</p>
    <div class="calculator"><strong>Калькулятор объёма</strong><label>Страниц в книге<input id="bookPages" type="number" min="20" max="500" value="80"></label><label>Разделов Mini App<input id="appModules" type="number" min="1" max="30" value="6"></label><label>Страниц SEO-сайта<input id="sitePages" type="number" min="1" max="50" value="8"></label><output id="estimate">Ориентир: 80 страниц книги · 6 разделов Mini App · 8 страниц сайта</output></div>
    <form id="paymentForm" class="payment"><label>Email для чека ЮKassa<input id="email" type="email" required placeholder="you@example.com" autocomplete="email"></label><button class="button" type="submit">Оплатить предоплату — 50 000 ₽</button><p id="paymentStatus" role="status"></p></form>
    <a class="back" href="/hot-offer.html">Вернуться к оферу</a>
    <script>const fields=['bookPages','appModules','sitePages'];const estimate=document.getElementById('estimate');function update(){estimate.textContent=`Ориентир: ${bookPages.value} страниц книги · ${appModules.value} разделов Mini App · ${sitePages.value} страниц сайта`}fields.forEach(id=>document.getElementById(id).addEventListener('input',update));document.getElementById('paymentForm').onsubmit=async e=>{e.preventDefault();const status=document.getElementById('paymentStatus');status.textContent='Создаём платёж…';try{const r=await fetch('/api/payment',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({product:'Health Expert Deposit',name:'Заявка hot-offer',email:document.getElementById('email').value,consent:true})});const data=await r.json();if(!r.ok||!data.confirmationUrl)throw Error(data.error||'Не удалось создать платёж');location.href=data.confirmationUrl}catch(error){status.textContent=error.message}}}</script>
  </main>
</body>
</html>
